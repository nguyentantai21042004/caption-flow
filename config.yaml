whisper:
  model_path: "models/ggml-large-v3-turbo.bin"
  binary_path: "./whisper.cpp/build/bin/whisper-cli"
  language: "en"
  prompt: "technical terms, code, architecture, API, system design, software engineering, programming, development"
  threads: 8
  use_gpu: true

ffmpeg:
  video_bitrate: "8M"
  audio_codec: "copy"
  encoder: "h264_videotoolbox"
  preset: "medium"

paths:
  input: "data/input"
  output: "data/output"
  archived: "data/archived"
  temp: "data/temp"

logging:
  level: "info"
  format: "text"

performance:
  max_concurrent: 2

deepseek:
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"

gemini:
  model: "gemini-2.5-flash"

# Enrich mode: YouTube URL -> captions + scene keyframes (Claude-ready bundle).
enrich:
  output_dir: "data/enrich"
  scene_threshold: 0.1          # lower = more keyframes (slides w/ fades)
  frame_width: 1280
  video_format: "best[height<=720]"
  sub_langs: "vi.*,vi"          # chỉ lấy vi (bài giảng VN) → khỏi đụng en → tránh 429
  keep_video: false
  cookies_browser: ""           # cookie-free; chỉ set "chrome"/"safari" nếu YouTube 429 dai (fallback)
